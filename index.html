<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Girls' Night Bar</title>
  <meta name="description" content="Tonight's cocktail menu">
  <meta name="color-scheme" content="light dark">
  <!-- Tints the phone's browser bar to match the page background -->
  <meta name="theme-color" content="#f5ecdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a1f1a" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Nunito+Sans:wght@400;600&display=swap">

  <link rel="stylesheet" href="styles.css">
  <script src="menu.js" defer></script>
  <script src="effects.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>Girls' Night Bar</h1>
    <p class="tagline">Pick your poison</p>
  </header>

  <main>
    <!-- Menu is rendered here by menu.js from the MENU data object. -->
    <section id="menu" class="menu" aria-label="Cocktail menu">
      <noscript>Please enable JavaScript to see the menu.</noscript>
    </section>
  </main>

  <footer class="site-footer">
    <p>Cheers! 🥂</p>
  </footer>
</body>
</html>
