<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PLACEHOLDER: page title shown in the browser tab -->
  <title>Cocktail Menu</title>
  <!-- PLACEHOLDER: short description (used by link previews) -->
  <meta name="description" content="Tonight's cocktail menu">
  <link rel="stylesheet" href="styles.css">
  <script src="menu.js" defer></script>
</head>
<body>
  <header class="site-header">
    <!-- PLACEHOLDER: event name / heading -->
    <h1>[Event title]</h1>
    <!-- PLACEHOLDER: optional subtitle, date, host names -->
    <p class="tagline">[Subtitle / date]</p>
  </header>

  <main>
    <!-- Menu is rendered here by menu.js from the MENU data object. -->
    <section id="menu" class="menu" aria-label="Cocktail menu">
      <noscript>Please enable JavaScript to see the menu.</noscript>
    </section>
  </main>

  <footer class="site-footer">
    <!-- PLACEHOLDER: footer note (e.g. "Ask the bartender for anything off-menu") -->
    <p>[Footer note]</p>
  </footer>
</body>
</html>
