<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Girls' Night Bar</title>
  <meta name="description" content="Tonight's cocktail menu">
  <meta name="color-scheme" content="light dark">
  <!-- Tints the phone's browser bar to match the page background -->
  <meta name="theme-color" content="#f5ecdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a1f1a" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Nunito+Sans:wght@400;600&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">

  <link rel="stylesheet" href="styles.css">
  <script src="menu.js" defer></script>
  <script src="effects.js" defer></script>
  <script src="pranks.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="lang-toggle" role="group" aria-label="Language / 언어">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ko" aria-pressed="false" lang="ko">한국어</button>
    </div>
    <!-- Text for elements with data-i18n lives in the UI object in menu.js -->
    <h1 data-i18n="title">Girls' Night Bar</h1>
    <p class="tagline" data-i18n="tagline">Pick your poison</p>
  </header>

  <main>
    <!-- Menu is rendered here by menu.js from the MENU data object. -->
    <section id="menu" class="menu" aria-label="Cocktail menu" data-i18n-aria="menuLabel">
      <noscript>Please enable JavaScript to see the menu.</noscript>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer">Cheers! 🥂</p>
    <div class="footer-actions">
      <button type="button" class="footer-btn" id="bartender-btn">
        <span class="bell" aria-hidden="true">🛎️</span>
        <span class="footer-btn-label" data-i18n="bartenderButton">Request Bartender</span>
      </button>
      <button type="button" class="footer-btn" id="tab-btn">
        <span aria-hidden="true">🧾</span>
        <span class="footer-btn-label" data-i18n="payTabButton">Pay Tab</span>
      </button>
    </div>
  </footer>

  <!-- Prank modals (behavior in pranks.js, text in the UI object in menu.js) -->
  <dialog class="gag-dialog shake" id="bartender-dialog" aria-labelledby="bartender-title">
    <div class="gag-emoji hop" aria-hidden="true">👆</div>
    <h2 id="bartender-title" data-i18n="bartenderTitle">Go up yourself bro</h2>
    <p class="gag-sub" data-i18n="bartenderSub">Don't be shy</p>
    <button type="button" class="gag-close" id="bartender-close" data-i18n="bartenderClose">Fine 🙄</button>
  </dialog>

  <dialog class="receipt-dialog" id="receipt-dialog" aria-labelledby="receipt-title">
    <div class="receipt">
      <button type="button" class="receipt-x" id="receipt-x" aria-label="Close" data-i18n-aria="close">✕</button>
      <div id="receipt-body"></div>
      <div class="receipt-pay">
        <button type="button" class="pay-btn pay-apple" data-i18n="payApple">Apple Pay</button>
        <button type="button" class="pay-btn pay-cash" data-i18n="payCash">Pay with Cash</button>
      </div>
    </div>
  </dialog>

  <dialog class="gag-dialog" id="jk-dialog" aria-labelledby="jk-title">
    <div class="gag-emoji wiggle" aria-hidden="true">😜</div>
    <h2 id="jk-title" data-i18n="jkTitle">jk just have a good time</h2>
    <button type="button" class="gag-close" id="jk-close" data-i18n="jkClose">Phew 😮‍💨</button>
  </dialog>
</body>
</html>
